---
- name: Initialiser le control plane
  hosts: master
  become: true

  tasks:
    - name: Initialiser kubeadm
      command: >
        kubeadm init
        --apiserver-advertise-address=192.168.4.203
        --pod-network-cidr=10.244.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Créer le dossier .kube pour ubuntu
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copier le kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu

    - name: Récupérer la commande join
      command: kubeadm token create --print-join-command
      register: join_command

    - name: Sauvegarder la commande join
      become: false
      local_action:
        module: copy
        content: "{{ join_command.stdout }}"
        dest: /tmp/join_command.sh